name: CI Pipeline

# 1. Déclenchement sur push et PR vers la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 2. Premier Job : Test
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Tu peux changer la version selon ton projet
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci # "npm ci" est recommandé pour les environnements de CI (plus propre et rapide)

      - name: Exécution des tests
        run: npm test

  # 3. Deuxième Job : Lint
  lint:
    runs-on: ubuntu-latest
    needs: test # Ce job attend que le job 'test' soit terminé avec succès
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification du style (Lint)
        run: npm run lint
#