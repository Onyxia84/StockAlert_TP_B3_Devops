name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: 
      - 'v*' # Se déclenche pour les tags comme v1.0, v2.1.3, etc.
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # 🚀 Nouveau Job : Build & Push Docker
  build:
    runs-on: ubuntu-latest
    needs: [test, lint] # Attend que les deux jobs précédents soient verts
    if: startsWith(github.ref, 'refs/tags/v') # Ne s'exécute QUE si c'est un tag v*
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction et Push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Remplace "ton-pseudo-docker" par ton vrai pseudo ou utilise la variable
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stock-alert:${{ github.ref_name }}
